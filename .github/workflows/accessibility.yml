name: Accessibility Check (WCAG 2.1 AA)

on:
  pull_request:
  workflow_dispatch:

jobs:
  a11y:
    name: axe-core WCAG 2.1 AA
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Render site and run WCAG 2.1 AA checks
        run: npm run a11y:render
